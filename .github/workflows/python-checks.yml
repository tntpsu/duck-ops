name: Duck Ops Checks

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Static guard for undefined names (F821) — catches the NameError class
      # that py_compile and the tests miss (an undefined name in an except/
      # fallback branch that never executes in a test, e.g. the _load_json
      # typo in the ROI-triage fallback).
      - name: Lint for undefined names (F821)
        run: |
          pip install ruff
          ruff check --select F821 runtime
      - name: Compile runtime python files
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path("runtime")
          files = sorted(root.rglob("*.py"))
          if not files:
              raise SystemExit("No runtime python files found.")
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files.")
          PY

  tests:
    # Added 2026-11-09. Until then "Duck Ops Checks ✓" meant the runtime
    # COMPILED -- 10 seconds, no test ever ran here. The suite could not run
    # in CI because 125 of 151 test files hard-coded an absolute path into one
    # particular checkout; a probe run that day reported 1486 passing while
    # importing a DIFFERENT copy of the repo than the one under test.
    runs-on: ubuntu-latest
    # The whole stack runs on one Mac set to America/New_York: the launchd
    # jobs, the producers, the viewer the operator reads. ~182 call sites
    # across 66 runtime modules treat system-local time AS the operator's
    # time, so the suite is pinned to the zone the code actually runs in
    # rather than inheriting the runner's UTC.
    #
    # What this does NOT prove: that duck-ops is zone-portable. It is not.
    # Five tests still fail under TZ=UTC (etsy_browser_batch,
    # nightly_action_summary x2, weekly_strategy_slot_window,
    # workflow_operator_summary) because they assert rendered Eastern
    # wall-clock. If duck-ops ever runs anywhere but that Mac, that is real
    # work, tracked in TESTS.md -- not something this pin has handled.
    #
    # scheduler_health is the exception and needs no pin: it resolves every
    # stamp in its own SCHEDULER_TZ and passes under any TZ.
    env:
      TZ: America/New_York
      # Mapped into `env` because the `secrets` context is not available in a
      # step-level `if`. Empty when the secret is unset, which is the signal
      # the sibling checkout below keys on.
      DUCKAGENT_RO_TOKEN: ${{ secrets.DUCKAGENT_RO_TOKEN }}
    steps:
      # Everything is checked out under `repos/` so the SIBLING layout the
      # code expects exists here too. `drop_digest.DUCK_AGENT_ROOT`,
      # `drive_mirror.DUCKAGENT_ROOT` and `tests/_siblings.py` all resolve
      # `REPO_ROOT.parent / "<name>"` from `__file__`, and actions/checkout
      # refuses a path outside the workspace -- so the parent has to be a
      # directory inside it rather than the workspace root.
      - uses: actions/checkout@v4
        with:
          path: repos/duck-ops
      # duckAgent is PRIVATE and duck-ops is PUBLIC, so the default
      # GITHUB_TOKEN cannot read it. Without this the suite still passes:
      # ten cross-repo assertions skip BY NAME via tests/_siblings.py, and
      # the run says what it could not check instead of implying it did.
      # With it, those ten run for real -- `email_reply_action_helper` is
      # pure stdlib, and the un-timed-call ratchet only needs the files to
      # EXIST so it can ast-parse them, which is the gap that mattered: with
      # duckAgent absent it reported three live un-timed calls as fixed.
      #
      # To enable: create a fine-grained PAT with Contents:Read on
      # tntpsu/duckAgent only, and add it as the repository secret
      # DUCKAGENT_RO_TOKEN. Note what that means in a PUBLIC repo -- a token
      # readable by any workflow run here. `on: push` only runs for commits
      # from someone with write access, and GitHub withholds secrets from
      # fork pull requests, so the exposure is to this repo's own
      # collaborators; read-only and single-repo scope is the point.
      - name: Check out duckAgent (skipped without a token)
        if: env.DUCKAGENT_RO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: tntpsu/duckAgent
          token: ${{ env.DUCKAGENT_RO_TOKEN }}
          path: repos/duckAgent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        working-directory: repos/duck-ops
        run: pip install -r requirements-test.txt
      - name: Say which siblings this run can see
        working-directory: repos/duck-ops
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import _siblings
          for name in ("duckAgent", "paint-to-print-3d"):
              print(f"{name}: {_siblings.sibling_repo(name) or 'NOT CHECKED OUT'}")
          print("reply buttons importable:",
                _siblings.duckagent_reply_helper_importable())
          print("preview helpers importable:",
                _siblings.duckagent_preview_helpers_importable())
          PY
      - name: Run the suite
        working-directory: repos/duck-ops
        run: pytest tests -q
